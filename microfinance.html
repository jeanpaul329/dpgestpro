<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MicroFinance — DIVINE PRIVILEGE</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,sans-serif;
      background:#1A1200;
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
    }
    .card{
      background:#fff;border-radius:16px;padding:40px 36px;
      text-align:center;max-width:420px;width:90%;
      box-shadow:0 8px 40px rgba(0,0,0,.4);
    }
    .icon{font-size:52px;margin-bottom:12px}
    .nom{font-size:22px;font-weight:700;color:#1A1200;margin-bottom:4px}
    .sub{font-size:13px;color:#888;margin-bottom:24px}
    .bar{height:4px;border-radius:2px;background:#3FB950;margin-bottom:24px}
    .msg{font-size:14px;color:#555;margin-bottom:20px}
    .btn{
      display:inline-block;background:#3FB950;color:#fff;
      padding:14px 36px;border-radius:10px;font-size:15px;
      font-weight:700;text-decoration:none;border:none;cursor:pointer;
      transition:opacity .2s;
    }
    .btn:hover{opacity:.85}
    .url{font-size:11px;color:#aaa;margin-top:16px;word-break:break-all}
    .spinner{
      display:none;width:32px;height:32px;border:3px solid #eee;
      border-top-color:#3FB950;border-radius:50%;
      animation:spin 0.8s linear infinite;margin:16px auto 0;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💰</div>
    <div class="nom">MicroFinance</div>
    <div class="sub">DIVINE PRIVILEGE — dpGestPro</div>
    <div class="bar"></div>
    <div class="msg">Cliquez pour accéder à votre espace de gestion</div>
    <a class="btn" href="https://jeanpaul329.github.io?ent=microfinance" onclick="go(event)">🚀 Accéder à l'application</a>
    <div class="spinner" id="spin"></div>
    <div class="url">https://jeanpaul329.github.io?ent=microfinance</div>
  </div>
  <script>
    function go(e){
      document.getElementById('spin').style.display='block';
      // Store ent in localStorage before redirect
      try{localStorage.setItem('dpg_url_ent','microfinance');}catch(ex){}
      // Let the href navigate normally
    }
    // Auto-redirect after 1.5s
    setTimeout(function(){
      try{localStorage.setItem('dpg_url_ent','microfinance');}catch(e){}
      window.location.href='https://jeanpaul329.github.io?ent=microfinance';
    }, 1500);
  </script>
</body>
</html>
